  <!DOCTYPE html>
<html>
<head>
<title>Sydney's Loan Calculator</title>

<script>
function pmt() {
let PV = document.getElementById("loan").value;
let r = document.getElementById("rate").value;
let n = document.getElementById("years").value;
  
let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));

 document.getElementById("ans").innerHTML =
   " If you have a $" + PV +
   " loan for " + n +  
   " years at " + r +
   "% interest, your monthly payment will be $" +
   P.toFixed(2) + ".";  
  
}

</script>

</head>
  
<body>

<h2>Sydney's Loan Calculator</h2>

<p> 
Loan Amount: 
<input id="loan" type="number"> 
</p>

<p> 
Number of Years: 
<input id="years" type="number"> 
</p> 

<p> Annual Interest Rate: 
<input id="rate" type="number" step="0.01"> 
</p> 

<button onclick="pmt()">Calculate Payment</button> 

<p id="ans"></p>
  
</body>
</html>
